# Sub-path deployment: this product served under /delivery-manager/ on a
# shared domain, behind the shared Caddy instance (see
# 3vnsystems-infrastructure/caddy/Caddyfile). For a dedicated host serving
# at the domain root, the image is built with nginx.root.conf instead —
# see cloud/Dockerfile's NGINX_CONF build arg.
server {
    listen 80;
    server_name _;

    # Container-level health check (used by the compose healthcheck).
    location = /healthz {
        default_type text/plain;
        return 200 "ok";
    }

    # This image is built with EXPO_WEB_BASE_PATH=/delivery-manager (see
    # cloud/Dockerfile), so the exported app's HTML/JS reference asset paths
    # under /delivery-manager/*. Serve it from that same path here so it
    # matches how Caddy forwards requests (full path, no prefix stripped).
    location = /delivery-manager {
        return 301 /delivery-manager/;
    }

    # Content-hashed build output (filenames like index-<hash>.js) — safe to
    # cache aggressively/immutably, since a new deploy always produces a
    # new filename rather than overwriting one under the same name.
    location ^~ /delivery-manager/_expo/static/ {
        alias /usr/share/nginx/html/_expo/static/;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /delivery-manager/ {
        alias /usr/share/nginx/html/;
        # index.html is not content-hashed and names the current build's
        # hashed bundle by URL, so it must never be served stale: a browser
        # holding an old cached index.html keeps pointing at a superseded
        # bundle indefinitely after a deploy. (This bit resume-optimizer
        # live on 2026-08-20 via Safari's heuristic caching — see the same
        # comment in that repo's nginx.conf.) "no-cache" still allows
        # caching; it just forces ETag revalidation, which is a cheap 304.
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /delivery-manager/index.html;
    }

    # Convenience redirect for anyone hitting the container root directly
    # (e.g. local `docker run` / troubleshooting outside of Caddy).
    location = / {
        return 301 /delivery-manager/;
    }
}
