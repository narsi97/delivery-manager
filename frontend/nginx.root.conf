# Root deployment: this product is the only thing on its host and is served
# at the domain root (https://deliveries.example.com/). Built with
# EXPO_WEB_BASE_PATH unset, so asset paths have no prefix.
#
# Kept as a separate file rather than templating nginx.conf: the two
# layouts differ structurally (a `location = /delivery-manager` redirect
# has no meaningful root-path equivalent), and an envsubst template that
# emits an invalid block when its variable is empty is a worse failure
# mode than two short, readable files.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    location = /healthz {
        default_type text/plain;
        return 200 "ok";
    }

    # Content-hashed bundles — immutable, cache forever.
    location ^~ /_expo/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        # See nginx.conf for why index.html must revalidate.
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
